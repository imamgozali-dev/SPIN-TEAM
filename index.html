<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPIN TEAM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0D1117;
    color:#F0F6FC;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
}

.card{
    background:#161B22;
    border:1px solid #30363D;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    font-size:32px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8B949E;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#C9D1D9;
}

select{
    width:100%;
    height:45px;
    background:#0D1117;
    color:white;
    border:1px solid #30363D;
    border-radius:10px;
    padding:0 12px;
    font-size:15px;
}

button{
    width:100%;
    height:50px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#238636;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#2EA043;
}

button:active{
    transform:scale(.98);
}

h2{
    margin-top:35px;
    margin-bottom:15px;
    font-size:22px;
}

.result{
    display:grid;
    gap:12px;
}

.player-card{
    background:#0D1117;
    border:1px solid #30363D;
    border-radius:10px;
    padding:15px;
    animation:fade .4s;
}

.player-title{
    color:#8B949E;
    font-size:13px;
    margin-bottom:6px;
}

.club{
    font-size:18px;
    font-weight:bold;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(8px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:600px){

h1{
font-size:26px;
}

.card{
padding:18px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>SPIN TEAM</h1>

<p class="subtitle">
Football Club Random Generator
</p>

<div class="form-group">

<label>Tier</label>

<select id="tier">

<option value="1">Tier 1</option>

<option value="2">Tier 2</option>

</select>

</div>

<div class="form-group">

<label>Jumlah Player</label>

<select id="players">

<option>2</option>

<option>3</option>

<option selected>4</option>

<option>5</option>

</select>

</div>

<button id="spinBtn">
SPIN TEAM
</button>

<h2>Result</h2>

<div class="result" id="result">

<div class="player-card">
<div class="player-title">Player 1</div>
<div class="club">-</div>
</div>

<div class="player-card">
<div class="player-title">Player 2</div>
<div class="club">-</div>
</div>

<div class="player-card">
<div class="player-title">Player 3</div>
<div class="club">-</div>
</div>

<div class="player-card">
<div class="player-title">Player 4</div>
<div class="club">-</div>
</div>

<div class="player-card">
<div class="player-title">Player 5</div>
<div class="club">-</div>
</div>

</div>

</div>

</div>
