<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPIN TEAM</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{

    background:#0B1220;
    color:#fff;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;

    padding:30px;

}

.container{

    width:100%;
    max-width:950px;

}

.card{

    background:#151F30;

    border:1px solid #26344C;

    border-radius:22px;

    padding:28px;

    margin-bottom:22px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.35);

}

header{

    text-align:center;

    margin-bottom:30px;

}

header h1{

    font-size:38px;

    font-weight:700;

    letter-spacing:3px;

}

header p{

    margin-top:10px;

    color:#9AA8BC;

    font-size:15px;

}

.wheel{

    height:420px;

    border-radius:18px;

    border:2px dashed #31415E;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:20px;

    color:#6D7D96;

}

.settings{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}

.group{

    display:flex;

    flex-direction:column;

}

.group label{

    margin-bottom:8px;

    font-size:14px;

    color:#A8B5C7;

}

select{

    height:48px;

    background:#0F1726;

    color:white;

    border:1px solid #2C3C59;

    border-radius:12px;

    padding:0 14px;

    font-size:15px;

    outline:none;

}

button{

    width:100%;

    height:56px;

    margin-top:24px;

    border:none;

    border-radius:14px;

    background:#2D8CFF;

    color:white;

    font-size:17px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    background:#4EA0FF;

}

.result{

    display:grid;

    gap:14px;

}

.player{

    background:#0F1726;

    border:1px solid #26344C;

    border-radius:12px;

    padding:18px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

.player span:first-child{

    color:#AAB5C4;

}

.player span:last-child{

    font-weight:600;

}

footer{

    text-align:center;

    color:#7E8DA3;

    margin-top:20px;

    font-size:13px;

}

@media(max-width:700px){

.settings{

grid-template-columns:1fr;

}

header h1{

font-size:30px;

}

.wheel{

height:300px;

}

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>SPIN TEAM</h1>

<p>Random Football Club Generator</p>

</header>

<div class="card">

<div class="wheel">

Wheel Spinner Area

</div>

</div>

<div class="card">

<div class="settings">

<div class="group">

<label>Tier</label>

<select>

<option>Tier 1</option>

<option>Tier 2</option>

<option>Tier 3</option>

</select>

</div>

<div class="group">

<label>Players</label>

<select>

<option>2</option>

<option>3</option>

<option selected>4</option>

<option>5</option>

<option>6</option>

<option>7</option>

<option>8</option>

</select>

</div>

</div>

<button>

SPIN TEAM

</button>

</div>

<div class="card">

<div class="result">

<div class="player">

<span>Player 1</span>

<span>-</span>

</div>

<div class="player">

<span>Player 2</span>

<span>-</span>

</div>

<div class="player">

<span>Player 3</span>

<span>-</span>

</div>

<div class="player">

<span>Player 4</span>

<span>-</span>

</div>

</div>

</div>

<footer>

SPIN TEAM • Version 1.0

</footer>

</div>

</body>
  </html>
